<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>于利惠 - 设计作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            color: #111;
            background-color: #fff;
            line-height: 1.6;
        }
        .container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        /* 导航栏 */
        nav {
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            background-color: #fff;
            z-index: 999;
        }
        .logo {
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            color: #111;
        }
        .nav-links {
            display: flex;
            gap: 40px;
        }
        .nav-links a {
            text-decoration: none;
            color: #111;
            font-weight: 400;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        .nav-links a:hover {
            color: #c4a87d;
        }
        /* 英雄区 */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 80px;
        }
        .hero-content h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .hero-content p {
            font-size: 20px;
            color: #666;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #c4a87d;
        }
        /* 滚动渐显 */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in.active {
            opacity: 1;
            transform: translateY(0);
        }
        /* 移动端适配 */
        @media (max-width: 768px) {
            .nav-links {
                gap: 20px;
            }
            .hero-content h1 {
                font-size: 48px;
            }
            .hero-content p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="container">
        <a href="index.html" class="logo">于利惠</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="work.html">作品</a>
            <a href="about.html">关于</a>
            <a href="service.html">服务</a>
            <a href="contact.html">联系</a>
        </div>
    </nav>

    <!-- 英雄区 -->
    <section class="hero">
        <div class="hero-content fade-in">
            <h1>设计是解决问题的艺术</h1>
            <p>专注品牌设计、UI/UX设计与视觉创意，用简洁有力的设计语言传递价值</p>
            <a href="work.html" class="btn">查看作品集</a>
        </div>
    </section>

    <script>
        // 滚动渐显效果
        document.addEventListener('DOMContentLoaded', function() {
            const fadeElements = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            fadeElements.forEach(element => {
                observer.observe(element);
            });

            // 初始触发首屏元素
            setTimeout(() => {
                fadeElements[0].classList.add('active');
            }, 300);
        });
    </script>
</body>
</html>
