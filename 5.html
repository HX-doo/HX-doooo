<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系 - 于利惠</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: #111; background: #fff; line-height: 1.6; }
        .container { width: 90%; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        /* 导航栏 */
        nav {
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            background: #fff;
            z-index: 999;
        }
        .logo { font-size: 24px; font-weight: 600; text-decoration: none; color: #111; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            text-decoration: none;
            color: #111;
            font-weight: 400;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: #c4a87d; }
        
        /* 联系区 */
        .contact-section { padding: 200px 0 100px; }
        .section-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 80px;
            position: relative;
            padding-bottom: 10px;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: #c4a87d;
        }
        
        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        
        .contact-text {
            font-size: 20px;
            color: #666;
            line-height: 1.8;
        }
        
        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .contact-icon {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4a87d;
        }
        
        .contact-value {
            text-decoration: none;
            color: #111;
            transition: color 0.3s ease;
        }
        .contact-value:hover { color: #c4a87d; }
        
        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .social-link {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-link:hover {
            background: #c4a87d;
            color: #fff;
        }
        
        /* 表单样式 */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .form-label {
            font-weight: 500;
            font-size: 16px;
        }
        
        .form-input, .form-textarea {
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #c4a87d;
        }
        
        .form-textarea {
            min-height: 180px;
            resize: vertical;
        }
        
        .form-btn {
            padding: 15px 30px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
            width: fit-content;
        }
        .form-btn:hover {
            background: #c4a87d;
        }
        
        /* 滚动渐显 */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in.active { opacity: 1; transform: translateY(0); }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .nav-links { gap: 20px; }
            .contact-section { padding: 150px 0 80px; }
            .section-title { font-size: 36px; margin-bottom: 40px; }
            .contact-content { grid-template-columns: 1fr; gap: 60px; }
            .contact-text { font-size: 16px; }
        }
    </style>
</head>
<body>

        <a href="index.html" class="logo">于利惠</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 表单提交处理
            const form = document.querySelector('.contact-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('感谢您的留言，我会尽快回复您！');
                form.reset();
            });
            
            // 滚动渐显效果
            const fadeElements = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            
            fadeElements.forEach(el => observer.observe(el));
        });
    </script>
